name: test and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test 'test/*.test.js'
      - run: node scripts/conformance.mjs
      - run: node scripts/conformance-page.mjs
      - run: node scripts/verify-archive.mjs data/abstract
      - run: |
          mkdir -p _site/data/abstract _site/conformance
          cp -r index.html og.png src icons logos art _site/
          cp -r data/abstract/agw data/abstract/manifest.json _site/data/abstract/
          cp -r data/lists _site/data/
          cp -r conformance/index.html conformance/vectors.json _site/conformance/
          cp -r public/.well-known _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
