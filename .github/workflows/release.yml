name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.1   # pinned; OIDC Trusted Publishing needs npm >=11.5.1 (Node 22 ships npm 10.x)
      - run: node --test 'test/*.test.js'
      - run: node scripts/conformance.mjs
      - run: node scripts/verify-archive.mjs data/abstract
      # The first release (1.0.0) is published by hand from a 2FA session (Trusted Publishing can only be set up
      # once the package exists), so skip a version that is already on npm instead of failing the tag build.
      - run: |
          spec="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already on npm, skipping publish"; else npm publish --access public; fi
      # Verify the published package's registry signature. The repo has no dependencies, so `npm audit signatures`
      # in the checkout finds nothing to audit and fails: audit a throwaway install of the published version instead.
      - run: |
          spec="$(node -p 'const p=require("./package.json"); p.name+"@"+p.version')"
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify" && npm init -y >/dev/null
          npm install --no-audit --no-fund "$spec" && npm audit signatures
